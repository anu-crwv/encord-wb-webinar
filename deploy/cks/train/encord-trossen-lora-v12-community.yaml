# v12 full-scale LoRA — action-head robustness build on encord_trossen_v8 (1894 real captioned eps) +
# compatible TrossenRoboticsCommunity WXAI datasets (~350 v2.1 eps, normalized to our 16-dim schema) for
# manipulation DIVERSITY (extends the v4->v6 diversity gain). IDENTICAL proven recipe to v11 (reuses the
# -gh200-1 package snapshot to dodge the fresh-install double-free); only dataset dir, run id, HOME cache,
# step count, lineage/tags change. GH200 (arm64), single-node, zero3_offload (~9.2s/step). MAX_STEPS=8000
# = the full-scale recipe that gave v6's strong offline head. Checkpoints -> W&B model artifact + registry.
apiVersion: batch/v1
kind: Job
metadata:
  name: wam-encord-trossen-lora-v12
  namespace: dreamzero
  labels: {app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "wam-train"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels: {app: wam-train, app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "wam-train"}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      nodeSelector:
        kubernetes.io/arch: arm64
        nvidia.com/gpu.product: NVIDIA-GH200-480GB
      tolerations:
        - {key: is_gpu, value: "true", operator: Equal, effect: PreferNoSchedule}
      containers:
        - name: train
          image: nvcr.io/nvidia/pytorch:25.04-py3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-exo", "pipefail", "-c"]
          args:
            - |
              export HOME=/data/.home-gh200-3 PIP_CACHE_DIR=/data/.home-gh200-3/.pip
              export TMPDIR=/data/.home-gh200-3/.tmp HF_HOME=/data/.hf
              mkdir -p $HOME $PIP_CACHE_DIR $TMPDIR $HF_HOME
              export WAM_REPO_ROOT=/data/src/dreamzero-wam
              export PYTHONPATH=$WAM_REPO_ROOT:${PYTHONPATH:-}
              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              export NNODES=1 NUM_GPUS=1
              export TRITON_CACHE_DIR=$TMPDIR/triton; mkdir -p $TRITON_CACHE_DIR
              cd $WAM_REPO_ROOT
              # Reuse the EXACT proven package set from -gh200-1 (a fresh --user install double-frees at step 0
              # under the ZeRO-3 checkpoint monkeypatch). Isolated read-only snapshot -> no writes to -gh200-1.
              if [ ! -f $HOME/.local/lib/python3.12/site-packages/deepspeed/__init__.py ]; then
                echo "[v12] snapshotting proven -gh200-1 .local -> $HOME/.local"; cp -a /data/.home-gh200-1/.local $HOME/.local
              fi
              python -c "import deepspeed, accelerate, transformers; print('[v12] env: deepspeed',deepspeed.__version__,'accelerate',accelerate.__version__)"
              DS_NVTX=$(find $HOME/.local/lib -path '*/deepspeed/utils/nvtx.py' 2>/dev/null | head -1)
              if [ -n "$DS_NVTX" ]; then sed -i 's/^enable_nvtx = True/enable_nvtx = False/' "$DS_NVTX"; echo "patched $DS_NVTX"; fi
              echo "trossen v12 COMMUNITY run_id=$WANDB_RUN_ID data=$DATA_CONFIG local=$WAM_DATASET_LOCAL_DIR out=$OUTPUT_DIR steps=$MAX_STEPS"
              test -f "$WAM_DATASET_LOCAL_DIR/meta/info.json" || { echo "FATAL: v12 dataset not assembled at $WAM_DATASET_LOCAL_DIR"; exit 1; }
              bash scripts/train/encord_trossen.sh
          env:
            - {name: WANDB_ENTITY,  value: encord-wb-physical-ai}
            - {name: WANDB_PROJECT, value: wam-finetune-webinar}
            - {name: WAM_REGISTRY_ORG, value: encord-wb-webinar}
            - {name: WANDB_RUN_ID,  value: v12community0727}
            - {name: OUTPUT_DIR,    value: /checkpoints/wam/runs/encord_trossen_lora_v12community0727}
            - {name: MAX_STEPS,     value: "8000"}
            - {name: SAVE_STEPS,    value: "1000"}
            - {name: TRAIN_ARCHITECTURE, value: lora}
            - {name: LEARNING_RATE, value: "1e-4"}
            - {name: PER_DEVICE_BATCH_SIZE, value: "1"}
            - {name: DEEPSPEED,     value: configs/deepspeed/zero3_offload.json}
            - {name: USE_AGIBOT_INIT, value: "0"}
            - {name: WAM_TRAIN_TAGS, value: "encord,trossen,lora,v12-community,real+community,widowxai-diversity,action-head,step-filter,full-scale"}
            - {name: DATA_CONFIG,   value: dreamzero/trossen_relative}
            - {name: DATA_ROOT_KEY, value: trossen_data_root}
            - {name: WAM_DATASET_LOCAL_DIR, value: /data/wam/datasets/encord_trossen_v12}
            - {name: WAM_DATASET_SOURCE_ARTIFACTS, value: "encord-wb-physical-ai/wam-finetune-webinar/encord-source-data:v5,encord-wb-physical-ai/wam-finetune-webinar/encord-captions:v6,encord-wb-physical-ai/wam-finetune-webinar/trossen-community-demos:latest"}
            - {name: WAM_CKPT_ARTIFACT_NAME, value: dreamzero-trossen-lora}
            - {name: VIDEO_BACKEND, value: ""}
          envFrom: [{secretRef: {name: wandb-api-key}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: "16", memory: 200Gi, nvidia.com/gpu: "1"}
            limits:   {cpu: "64", memory: 460Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data,        mountPath: /data}
            - {name: checkpoints, mountPath: /checkpoints}
            - {name: dshm,        mountPath: /dev/shm}
      volumes:
        - {name: data,        persistentVolumeClaim: {claimName: dreamzero-data}}
        - {name: checkpoints, persistentVolumeClaim: {claimName: dreamzero-checkpoints}}
        - {name: dshm,        emptyDir: {medium: Memory, sizeLimit: 64Gi}}
