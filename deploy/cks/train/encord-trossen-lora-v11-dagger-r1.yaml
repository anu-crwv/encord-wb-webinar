# v11 DAgger round-1 co-train — LoRA on v10 (real v8 + clean round-0 sim demos) + ON-POLICY CORRECTIVE
# demos (v10 ckpt-2000 rolled out @ beta=0.3, expert-relabelled on the policy's own drifted/hover states).
# This is the on-policy DAgger step that targets the closed-loop covariate shift v10 still showed (hovers
# ~34cm out, never commits to the descent). IDENTICAL recipe to the proven v10 job — ONLY the dataset dir,
# run id, HOME, lineage/tags change — so v11 ckpt-N vs v10 ckpt-N is a clean A/B isolating the round-1 data.
# GH200 (arm64), single-node; scheduler places it on the free GH200 (co-train holds the other). Reads the
# local v11 dir directly.
apiVersion: batch/v1
kind: Job
metadata:
  name: wam-encord-trossen-lora-v11
  namespace: dreamzero
  labels: {app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "wam-train"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels: {app: wam-train, app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "wam-train"}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      nodeSelector:
        kubernetes.io/arch: arm64
        nvidia.com/gpu.product: NVIDIA-GH200-480GB
      tolerations:
        - {key: is_gpu, value: "true", operator: Equal, effect: PreferNoSchedule}
      containers:
        - name: train
          image: nvcr.io/nvidia/pytorch:25.04-py3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-exo", "pipefail", "-c"]
          args:
            - |
              export HOME=/data/.home-gh200-3 PIP_CACHE_DIR=/data/.home-gh200-3/.pip
              export TMPDIR=/data/.home-gh200-3/.tmp HF_HOME=/data/.hf
              mkdir -p $HOME $PIP_CACHE_DIR $TMPDIR $HF_HOME
              export WAM_REPO_ROOT=/data/src/dreamzero-wam
              export PYTHONPATH=$WAM_REPO_ROOT:${PYTHONPATH:-}
              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
              export NNODES=1 NUM_GPUS=1
              export TRITON_CACHE_DIR=$TMPDIR/triton; mkdir -p $TRITON_CACHE_DIR
              cd $WAM_REPO_ROOT
              # A fresh --user install "double free or corruption (out)"s at training step 0 on this setup —
              # identical crash on a fresh -gh200-2, WITH the deepspeed/accelerate 0.19.0/1.13.0 pin, AND with
              # the PROVEN v10 dataset -> it's the ENV's package set, not the data or deepspeed alone. So REUSE
              # the EXACT proven package set from -gh200-1 (the running v10 co-train's home) via an isolated
              # read-only snapshot into this home. No writes to -gh200-1 -> co-train hedge unaffected. Skip the
              # pip install entirely (packages come from the snapshot).
              if [ ! -f $HOME/.local/lib/python3.12/site-packages/deepspeed/__init__.py ]; then
                echo "[v11] snapshotting proven -gh200-1 .local -> $HOME/.local"; cp -a /data/.home-gh200-1/.local $HOME/.local
              fi
              python -c "import deepspeed, accelerate, transformers; print('[v11] reused env: deepspeed',deepspeed.__version__,'accelerate',accelerate.__version__,'transformers',transformers.__version__)"
              DS_NVTX=$(find $HOME/.local/lib -path '*/deepspeed/utils/nvtx.py' 2>/dev/null | head -1)
              if [ -n "$DS_NVTX" ]; then sed -i 's/^enable_nvtx = True/enable_nvtx = False/' "$DS_NVTX"; echo "patched $DS_NVTX"; fi
              echo "trossen DAgger R1 CO-TRAIN run_id=$WANDB_RUN_ID data=$DATA_CONFIG local=$WAM_DATASET_LOCAL_DIR out=$OUTPUT_DIR steps=$MAX_STEPS"
              test -f "$WAM_DATASET_LOCAL_DIR/meta/info.json" || { echo "FATAL: v11 dataset not assembled at $WAM_DATASET_LOCAL_DIR"; exit 1; }
              bash scripts/train/encord_trossen.sh
          env:
            - {name: WANDB_ENTITY,  value: encord-wb-physical-ai}
            - {name: WANDB_PROJECT, value: wam-finetune-webinar}
            - {name: WAM_REGISTRY_ORG, value: encord-wb-webinar}
            - {name: WANDB_RUN_ID,  value: v11daggerr10723}
            - {name: OUTPUT_DIR,    value: /checkpoints/wam/runs/encord_trossen_lora_v11daggerr10723}
            - {name: MAX_STEPS,     value: "6000"}
            - {name: SAVE_STEPS,    value: "1000"}
            - {name: TRAIN_ARCHITECTURE, value: lora}
            - {name: LEARNING_RATE, value: "1e-4"}
            - {name: PER_DEVICE_BATCH_SIZE, value: "1"}
            - {name: DEEPSPEED,     value: configs/deepspeed/zero3_offload.json}
            - {name: USE_AGIBOT_INIT, value: "0"}
            - {name: WAM_TRAIN_TAGS, value: "encord,trossen,lora,v11-dagger,real+sim-demos,dagger-r1,on-policy-correction,step-filter"}
            - {name: DATA_CONFIG,   value: dreamzero/trossen_relative}
            - {name: DATA_ROOT_KEY, value: trossen_data_root}
            - {name: WAM_DATASET_LOCAL_DIR, value: /data/wam/datasets/encord_trossen_v11}
            - {name: WAM_DATASET_SOURCE_ARTIFACTS, value: "encord-wb-physical-ai/wam-finetune-webinar/encord-source-data:v5,encord-wb-physical-ai/wam-finetune-webinar/encord-captions:v6,encord-wb-physical-ai/wam-finetune-webinar/trossen-dagger-demos:latest,encord-wb-physical-ai/wam-finetune-webinar/trossen-dagger-r1-demos:latest"}
            - {name: WAM_CKPT_ARTIFACT_NAME, value: dreamzero-trossen-lora}
            - {name: VIDEO_BACKEND, value: ""}
          envFrom: [{secretRef: {name: wandb-api-key}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: "16", memory: 200Gi, nvidia.com/gpu: "1"}
            limits:   {cpu: "64", memory: 460Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data,        mountPath: /data}
            - {name: checkpoints, mountPath: /checkpoints}
            - {name: dshm,        mountPath: /dev/shm}
      volumes:
        - {name: data,        persistentVolumeClaim: {claimName: dreamzero-data}}
        - {name: checkpoints, persistentVolumeClaim: {claimName: dreamzero-checkpoints}}
        - {name: dshm,        emptyDir: {medium: Memory, sizeLimit: 64Gi}}
