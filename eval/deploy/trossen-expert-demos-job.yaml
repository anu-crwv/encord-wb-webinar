# DAgger Phase 2 — generate CLEAN scripted-expert demos (LeRobot episodes: sim obs + expert 16-dim
# actions + correct object grounding + task caption). The expert filters to successful picks and writes
# dense episodes + a demos.json manifest. Sharded by seed base so shards produce DIFFERENT jittered
# demos in parallel. NO policy server. sed __TAG__ / __CONFIG__ / __OUT__ / __EPISODES__ / __SEEDBASE__.
apiVersion: batch/v1
kind: Job
metadata:
  name: trossen-expert-demos-__TAG__
  namespace: dreamzero
  labels: {app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "trossen-expert"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels: {app: trossen-expert-demos-__TAG__, app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "trossen-expert"}
    spec:
      restartPolicy: Never
      securityContext: {runAsUser: 0, runAsGroup: 0, fsGroup: 0}
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
      tolerations:
        - {key: is_gpu, value: "true", operator: Equal, effect: PreferNoSchedule}
      containers:
        - name: expert
          image: nvcr.io/nvidia/isaac-sim:6.0.0-dev2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/data/src/dreamzero-wam/eval/runner.sh"]
          env:
            - {name: ACCEPT_EULA, value: "Y"}
            - {name: PRIVACY_CONSENT, value: "Y"}
            - {name: OMNI_KIT_ACCEPT_EULA, value: "YES"}
            - {name: WAM_EVAL_ENTRY, value: "scripted_expert_trossen.py"}
            - {name: WAM_SKIP_SERVER_PROBE, value: "1"}
            - {name: EVAL_JOBS_CONFIG, value: "__CONFIG__"}
            - {name: WAM_EXPERT_EPISODES, value: "__EPISODES__"}
            - {name: WAM_EXPERT_OUT, value: "__OUT__"}
            - {name: WAM_EP_SEED_BASE, value: "__SEEDBASE__"}
            - {name: WAM_MAX_STEPS, value: "400"}
            - {name: WAM_RESET_JITTER, value: "0.05"}
            - {name: WAM_TABLE_X, value: "0.20"}
            - {name: WAM_CUBE_X, value: "0.50"}
            - {name: WAM_CUBE_Y, value: "0.16"}
            - {name: WAM_BOWL_X, value: "0.56"}
            - {name: WAM_BOWL_Y, value: "-0.02"}
            - {name: WAM_EVAL_SRC, value: "/data/src/dreamzero-wam/eval"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            # Weave off for bulk demo-gen (metrics not needed per-episode; keeps it fast + quiet)
            - {name: WAM_EVAL_NO_WEAVE, value: "1"}
          resources:
            requests: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
            limits:   {cpu: "24", memory: 128Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data,        mountPath: /data}
            - {name: checkpoints, mountPath: /checkpoints}
            - {name: dshm,        mountPath: /dev/shm}
      volumes:
        - {name: data,        persistentVolumeClaim: {claimName: dreamzero-data}}
        - {name: checkpoints, persistentVolumeClaim: {claimName: dreamzero-checkpoints}}
        - {name: dshm,        emptyDir: {medium: Memory, sizeLimit: 32Gi}}
