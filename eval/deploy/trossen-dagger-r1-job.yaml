# DAgger round-1 on-policy relabel data-gen. Rolls out the CURRENT policy (served by the -rt
# deployment; repoint its MODEL_DIR to the policy you want to correct BEFORE running) with the
# expert in the loop (WAM_DAGGER_BETA), recording (policy-context obs -> expert corrective action)
# LeRobot episodes to WAM_EXPERT_OUT. Needs the server (unlike the pure scripted expert).
# sed __TAG__ / __CONFIG__ / __SEEDBASE__ / __EPISODES__ at apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: trossen-dagger-r1-__TAG__
  namespace: dreamzero
  labels: {app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "trossen-dagger"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels: {app: trossen-dagger-r1-__TAG__, app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "trossen-dagger"}
    spec:
      restartPolicy: Never
      securityContext: {runAsUser: 0, runAsGroup: 0, fsGroup: 0}
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
      tolerations:
        - {key: is_gpu, value: "true", operator: Equal, effect: PreferNoSchedule}
      containers:
        - name: dagger
          image: nvcr.io/nvidia/isaac-sim:6.0.0-dev2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/data/src/dreamzero-wam/eval/runner.sh"]
          env:
            - {name: ACCEPT_EULA, value: "Y"}
            - {name: PRIVACY_CONSENT, value: "Y"}
            - {name: OMNI_KIT_ACCEPT_EULA, value: "YES"}
            - {name: WAM_EVAL_ENTRY, value: "dagger_rollout_relabel.py"}
            - {name: EVAL_JOBS_CONFIG, value: "__CONFIG__"}
            - {name: DZ_HOST, value: "dreamzero-trossen-inference-rt"}
            - {name: DZ_PORT, value: "8001"}
            - {name: WAM_DAGGER_BETA, value: "0.5"}
            - {name: WAM_DAGGER_EPISODES, value: "__EPISODES__"}
            - {name: WAM_MAX_STEPS, value: "160"}
            - {name: WAM_ARM_JITTER, value: "0.10"}
            - {name: WAM_RESET_JITTER, value: "0.04"}
            - {name: WAM_EP_SEED_BASE, value: "__SEEDBASE__"}
            - {name: WAM_EXPERT_OUT, value: "/data/wam/datasets/dagger_r1/__TAG__"}
            - {name: WAM_EVAL_NO_WEAVE, value: "1"}
            # solvable scene (matches the eval + round-0 demo scene)
            - {name: WAM_TABLE_X, value: "0.20"}
            - {name: WAM_CUBE_X, value: "0.55"}
            - {name: WAM_CUBE_Y, value: "0.15"}
            - {name: WAM_BOWL_X, value: "0.56"}
            - {name: WAM_BOWL_Y, value: "-0.06"}
            - {name: WAM_EVAL_SRC, value: "/data/src/dreamzero-wam/eval"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          envFrom: [{secretRef: {name: wandb-api-key}}]
          resources:
            requests: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
            limits:   {cpu: "32", memory: 200Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data,        mountPath: /data}
            - {name: checkpoints, mountPath: /checkpoints}
            - {name: dshm,        mountPath: /dev/shm}
      volumes:
        - {name: data,        persistentVolumeClaim: {claimName: dreamzero-data}}
        - {name: checkpoints, persistentVolumeClaim: {claimName: dreamzero-checkpoints}}
        - {name: dshm,        emptyDir: {medium: Memory, sizeLimit: 32Gi}}
