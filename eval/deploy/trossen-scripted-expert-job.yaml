# Scripted IK pick-place EXPERT (eval/scripted_expert_trossen.py) — DAgger Phase 1 foundation.
# Positive control (is the scene solvable?) + corrective labeler + clean-demo source. NO policy
# server. Isaac image on RTX. Eval-only unless WAM_EXPERT_OUT is set (then writes LeRobot demos).
# sed __TAG__ / __CONFIG__ at apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: trossen-scripted-expert-__TAG__
  namespace: dreamzero
  labels: {app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "trossen-expert"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels: {app: trossen-scripted-expert-__TAG__, app.kubernetes.io/part-of: dreamzero, dreamzero/gate: "trossen-expert"}
    spec:
      restartPolicy: Never
      securityContext: {runAsUser: 0, runAsGroup: 0, fsGroup: 0}
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
      tolerations:
        - {key: is_gpu, value: "true", operator: Equal, effect: PreferNoSchedule}
      containers:
        - name: expert
          image: nvcr.io/nvidia/isaac-sim:6.0.0-dev2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/data/src/dreamzero-wam/eval/runner.sh"]
          env:
            - {name: ACCEPT_EULA, value: "Y"}
            - {name: PRIVACY_CONSENT, value: "Y"}
            - {name: OMNI_KIT_ACCEPT_EULA, value: "YES"}
            - {name: WAM_EVAL_ENTRY, value: "scripted_expert_trossen.py"}
            - {name: WAM_SKIP_SERVER_PROBE, value: "1"}
            - {name: EVAL_JOBS_CONFIG, value: "__CONFIG__"}
            - {name: WAM_EXPERT_EPISODES, value: "__EPISODES__"}
            - {name: WAM_EXPERT_OUT, value: "__OUT__"}
            - {name: WAM_MAX_STEPS, value: "400"}
            - {name: WAM_RESET_JITTER, value: "0.04"}
            # Scene: object at the working pick pose (0.55,0.15 on the 0.96 table -> reach 2/2 in test);
            # ONLY the bin is moved into the left arm's workspace (stock (0.80,-0.30) was unreachable ->
            # "place" was impossible for ANY policy, so the 0/0 place baselines were a scene artifact).
            - {name: WAM_TABLE_X, value: "0.20"}
            - {name: WAM_CUBE_X, value: "0.55"}
            - {name: WAM_CUBE_Y, value: "0.15"}
            - {name: WAM_BOWL_X, value: "0.56"}
            - {name: WAM_BOWL_Y, value: "-0.06"}
            - {name: WAM_EVAL_SRC, value: "/data/src/dreamzero-wam/eval"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            # Weave/W&B results tracing (leaderboard: model=scripted_ik_expert, dataset=trossen_sim_<task>)
            - {name: WANDB_ENTITY,  value: "encord-wb-physical-ai"}
            - {name: WEAVE_PROJECT, value: "wam-finetune-webinar"}
            - {name: WEAVE_MODEL,   value: "scripted_ik_expert"}
            - {name: WAM_EVAL_VIDEO_DIR, value: "/data/wam/eval_videos/scripted_expert"}
          envFrom: [{secretRef: {name: wandb-api-key}}]
          resources:
            requests: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
            limits:   {cpu: "32", memory: 200Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: data,        mountPath: /data}
            - {name: checkpoints, mountPath: /checkpoints}
            - {name: dshm,        mountPath: /dev/shm}
      volumes:
        - {name: data,        persistentVolumeClaim: {claimName: dreamzero-data}}
        - {name: checkpoints, persistentVolumeClaim: {claimName: dreamzero-checkpoints}}
        - {name: dshm,        emptyDir: {medium: Memory, sizeLimit: 32Gi}}
